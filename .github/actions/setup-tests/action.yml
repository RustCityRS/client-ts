name: Set up the 530 test suite
description: Install the toolchain and prepare the original SD and HD reference inputs
runs:
    using: composite
    steps:
        - uses: oven-sh/setup-bun@v2
          with:
              bun-version: 1.2.14
        - uses: actions/setup-node@v6
          with:
              node-version: '24'
        - uses: actions/setup-python@v6
          with:
              python-version: '3.12'
        - uses: actions/setup-java@v5
          with:
              distribution: temurin
              # Pack200 needs JDK 8. The Windows AWT pixel fixtures were captured on Temurin 21.0.7+6.
              java-version: |
                  8
                  ${{ runner.os == 'Windows' && '21.0.7+6' || '21' }}
        - run: bun install --frozen-lockfile
          shell: bash
        - uses: actions/cache@v5
          with:
              # Transfers the verified downloads between jobs. The disk cache and
              # platform-specific JOGL libraries are prepared on each runner.
              path: |
                  out/references/*.jar
                  out/references/*.zip
                  out/references/*.json
                  out/references/hd/*.jar
              key: rs530-references-${{ hashFiles('tools/ci/references.py', 'tools/ci/UnpackGamepack.java') }}
              enableCrossOsArchive: true
        - run: python tools/ci/references.py out/references --full
          shell: bash
